name: Update UCL leaderboards

on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ucl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stats.json
        run: python3 scripts/ucl_build.py

      - name: Sync data into published docs/
        run: |
          mkdir -p docs/assets/ucl
          cp assets/ucl/stats.json assets/ucl/match_cache.json docs/assets/ucl/

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ucl assets/tm_img_cache.json docs/assets/ucl
          git diff --cached --quiet || git commit -m "chore: daily UCL stats update"
          git push
