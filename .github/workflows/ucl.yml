name: Update UCL leaderboards

on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:
    inputs:
      tm_limit:
        description: "Photos to resolve this run (blank = the daily default). Raise it to drain a backlog in one go."
        required: false

permissions:
  contents: write

concurrency:
  group: ucl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate on season start
        id: gate
        run: |
          if python3 scripts/ucl_build.py --gate; then
            echo "Season underway — refreshing."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Off-season — stats frozen, backfilling missing photos only."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Route Transfermarkt requests around the runner IP block
        uses: ./.github/actions/warp-proxy

      - name: Build stats (in-season) or backfill photos (off-season)
        env:
          UCL_TM_LIMIT: ${{ inputs.tm_limit }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          if [ "${{ steps.gate.outputs.proceed }}" = "true" ]; then
            python3 scripts/ucl_build.py
          else
            python3 scripts/ucl_build.py --images-only
          fi

      - name: Sync data into published docs/
        run: |
          mkdir -p docs/assets/ucl
          cp assets/ucl/stats.json assets/ucl/match_cache.json docs/assets/ucl/

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ucl assets/tm_img_cache.json assets/nation_cache.json docs/assets/ucl
          if [ "${{ steps.gate.outputs.proceed }}" = "true" ]; then
            msg="chore: daily UCL stats update"
          else
            msg="chore: UCL off-season photo backfill"
          fi
          git diff --cached --quiet || git commit -m "$msg"
          git push
