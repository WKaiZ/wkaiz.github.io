name: Update Bundesliga leaderboards

on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bundesliga-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep last season's board frozen through the off-season; only start
      # refreshing a day after the new season's first match kicks off.
      - name: Gate on season start
        id: gate
        run: |
          if python3 scripts/bundesliga_build.py --gate; then
            echo "Season underway — refreshing."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "New season hasn't kicked off yet — leaving last season's board in place."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build stats.json
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/bundesliga_build.py

      - name: Sync data into published docs/
        if: steps.gate.outputs.proceed == 'true'
        run: |
          mkdir -p docs/assets/bundesliga
          cp assets/bundesliga/stats.json assets/bundesliga/match_cache.json docs/assets/bundesliga/

      - name: Commit changes if any
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/bundesliga assets/tm_img_cache.json docs/assets/bundesliga
          git diff --cached --quiet || git commit -m "chore: daily Bundesliga stats update"
          git push
