name: Update Bundesliga leaderboards

on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch:
    inputs:
      tm_limit:
        description: "Photos to resolve this run (blank = the daily default). Raise it to drain a backlog in one go."
        required: false

permissions:
  contents: write

concurrency:
  group: bundesliga-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate on season start
        id: gate
        run: |
          if python3 scripts/bundesliga_build.py --gate; then
            echo "Season underway — refreshing."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Off-season — stats frozen, backfilling missing photos only."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Route Transfermarkt requests around the runner IP block
        uses: ./.github/actions/warp-proxy

      - name: Build stats (in-season) or backfill photos (off-season)
        env:
          BUNDESLIGA_TM_LIMIT: ${{ inputs.tm_limit }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          if [ "${{ steps.gate.outputs.proceed }}" = "true" ]; then
            python3 scripts/bundesliga_build.py
          else
            python3 scripts/bundesliga_build.py --images-only
          fi

      - name: Sync data into published docs/
        run: |
          mkdir -p docs/assets/bundesliga
          cp assets/bundesliga/stats.json assets/bundesliga/match_cache.json docs/assets/bundesliga/

      - name: Stage changes
        id: stage
        run: |
          git add assets/bundesliga assets/tm_img_cache.json assets/nation_cache.json docs/assets/bundesliga
          if [ "${{ steps.gate.outputs.proceed }}" = "true" ]; then
            echo "message=chore: daily Bundesliga stats update" >> "$GITHUB_OUTPUT"
          else
            echo "message=chore: Bundesliga off-season photo backfill" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        uses: ./.github/actions/commit-push
        with:
          message: ${{ steps.stage.outputs.message }}
