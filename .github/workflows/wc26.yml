name: Update WC26 leaderboards

on:
  schedule:
    - cron: "50 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wc26-update
  cancel-in-progress: false

env:
  # World Cup ended 2026-07-19; freeze the stats the day after. Past that date we
  # keep running daily but only backfill missing player photos, never the stats.
  LAST_UPDATE_DATE: "2026-07-20"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Decide update mode
        id: mode
        run: |
          today="$(date -u +%F)"
          if [[ "$today" > "$LAST_UPDATE_DATE" ]]; then
            echo "Today ($today) is past $LAST_UPDATE_DATE — stats frozen, backfilling photos only."
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stats (during tournament) or backfill photos (after)
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            python3 scripts/wc26_build.py
          else
            python3 scripts/wc26_build.py --images-only
          fi

      - name: Sync data into published docs/
        run: |
          mkdir -p docs/assets/wc26
          cp assets/wc26/stats.json assets/wc26/match_cache.json docs/assets/wc26/

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/wc26 assets/tm_img_cache.json docs/assets/wc26
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            msg="chore: daily WC26 stats update"
          else
            msg="chore: WC26 photo backfill"
          fi
          git diff --cached --quiet || git commit -m "$msg"
          git push
