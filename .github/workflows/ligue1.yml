name: Update Ligue 1 leaderboards

on:
  schedule:
    - cron: "50 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ligue1-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate on season start
        id: gate
        run: |
          if python3 scripts/ligue1_build.py --gate; then
            echo "Season underway — refreshing."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Off-season — stats frozen, backfilling missing photos only."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build stats (in-season) or backfill photos (off-season)
        run: |
          if [ "${{ steps.gate.outputs.proceed }}" = "true" ]; then
            python3 scripts/ligue1_build.py
          else
            python3 scripts/ligue1_build.py --images-only
          fi

      - name: Sync data into published docs/
        run: |
          mkdir -p docs/assets/ligue1
          cp assets/ligue1/stats.json assets/ligue1/match_cache.json docs/assets/ligue1/

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ligue1 assets/tm_img_cache.json assets/nation_cache.json docs/assets/ligue1
          if [ "${{ steps.gate.outputs.proceed }}" = "true" ]; then
            msg="chore: daily Ligue 1 stats update"
          else
            msg="chore: Ligue 1 off-season photo backfill"
          fi
          git diff --cached --quiet || git commit -m "$msg"
          git push
