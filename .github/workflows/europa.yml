name: Update Europa League leaderboards

on:
  schedule:
    - cron: "50 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: europa-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate on season start
        id: gate
        run: |
          if python3 scripts/europa_build.py --gate; then
            echo "Season underway — refreshing."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Off-season — stats frozen, backfilling missing photos only."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build stats (in-season) or backfill photos (off-season)
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          if [ "${{ steps.gate.outputs.proceed }}" = "true" ]; then
            python3 scripts/europa_build.py
          else
            python3 scripts/europa_build.py --images-only
          fi

      - name: Sync data into published docs/
        run: |
          mkdir -p docs/assets/europa
          cp assets/europa/stats.json assets/europa/match_cache.json docs/assets/europa/

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/europa assets/tm_img_cache.json assets/nation_cache.json docs/assets/europa
          if [ "${{ steps.gate.outputs.proceed }}" = "true" ]; then
            msg="chore: daily Europa League stats update"
          else
            msg="chore: Europa League off-season photo backfill"
          fi
          git diff --cached --quiet || git commit -m "$msg"
          git push
