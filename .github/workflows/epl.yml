name: Update Premier League leaderboards

on:
  schedule:
    - cron: "50 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: epl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stats.json
        run: python3 scripts/epl_build.py

      - name: Sync data into published docs/
        run: |
          mkdir -p docs/assets/epl
          cp assets/epl/stats.json assets/epl/match_cache.json docs/assets/epl/

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/epl assets/tm_img_cache.json docs/assets/epl
          git diff --cached --quiet || git commit -m "chore: daily Premier League stats update"
          git push
