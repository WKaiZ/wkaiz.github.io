name: Probe Transfermarkt reachability

# Diagnostic only — never scheduled. Transfermarkt answers GitHub's runner IPs
# differently than it answers a laptop, so when photo backfill stops finding
# anything, run this to see which of scripts/tmfetch.py's strategies a runner
# can actually use. It makes two requests per strategy and writes nothing.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report usable fetch strategies
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python3 scripts/tmfetch.py

  probe-tlds:
    # Transfermarkt runs the same site on ~30 country domains. The main three
    # sit behind one WAF that refuses runner IPs; this checks whether any
    # regional edge is configured differently, which would make the fix a host
    # list rather than a proxy.
    runs-on: ubuntu-latest
    steps:
      - name: Sweep every regional domain
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          for host in transfermarkt.us transfermarkt.com transfermarkt.de \
                      transfermarkt.co.uk transfermarkt.at transfermarkt.be \
                      transfermarkt.ch transfermarkt.co transfermarkt.co.id \
                      transfermarkt.co.in transfermarkt.co.kr transfermarkt.co.za \
                      transfermarkt.com.ar transfermarkt.com.br transfermarkt.com.tr \
                      transfermarkt.es transfermarkt.fr transfermarkt.gr \
                      transfermarkt.it transfermarkt.jp transfermarkt.mx \
                      transfermarkt.nl transfermarkt.pe transfermarkt.pl \
                      transfermarkt.pt transfermarkt.ro transfermarkt.world; do
            out=$(curl -sS -m 25 -w '%{http_code} %{size_download}' -o /tmp/body \
                  -A "$UA" -H 'Accept-Language: en-US,en;q=0.9' \
                  "https://www.$host/x/profil/spieler/2219" 2>&1) || out="curl-failed"
            hit=$(grep -c -o 'portrait/big/2219-[0-9]*' /tmp/body 2>/dev/null || echo 0)
            verdict=$([ "$hit" -gt 0 ] && echo "PORTRAIT <-- usable" || echo blocked)
            printf '  %-26s %s  %s\n' "$host" "$out" "$verdict"
          done

  probe-warp:
    # Same two requests, but sent through Cloudflare WARP's local SOCKS proxy
    # so they leave on a consumer network rather than the runner's Azure IP.
    # Proxy mode (not a full tunnel) keeps every other request in the workflow
    # -- ESPN, fotmob, GitHub -- on the normal path.
    runs-on: ubuntu-latest
    steps:
      - name: Install and connect Cloudflare WARP in proxy mode
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos proxy port 40000
          sudo warp-cli --accept-tos connect
          for i in $(seq 1 20); do
            warp-cli --accept-tos status | grep -q Connected && break || sleep 2
          done
          warp-cli --accept-tos status
          echo "waiting for the SOCKS listener on 40000 ..."
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/40000) >/dev/null 2>&1 && { echo "  listening"; break; }
            sleep 2
          done
          ss -lntp | grep 40000 || echo "  nothing bound to 40000"
          echo -n "egress via WARP: "; curl -sS -m 25 --proxy socks5h://127.0.0.1:40000 https://api.ipify.org || echo "(failed: $?)"; echo
          echo -n "egress direct:   "; curl -sS -m 25 https://ifconfig.me/ip || echo "(failed: $?)"; echo

      - name: Read a Transfermarkt profile through the proxy
        run: |
          for tid in 2219 1146046; do
            body=$(curl -sS -m 30 --proxy socks5h://127.0.0.1:40000 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
              "https://www.transfermarkt.us/x/profil/spieler/$tid")
            echo "#$tid: $(printf '%s' "$body" | wc -c) bytes"
            printf '%s' "$body" | grep -o "portrait/big/$tid-[0-9]*\.[a-zA-Z]*" | head -1
            printf '%s' "$body" | grep -c "schnellsuche" | sed 's/^/  site-marker hits: /'
          done
